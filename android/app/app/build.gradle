plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.moyakorzina.app'
    compileSdk 34

    defaultConfig {
        applicationId "ru.moyakorzina.app"
        minSdk 24
        targetSdk 34
        // 1.3: приложение стало оболочкой сайта с мостом window.Korzina (шаг 1
        // единой архитектуры, 16.10.2026) — ряда кнопок сетей и нижней панели больше нет.
        // 1.4: «Собрать» — корзина в сети кнопками сайта и итог корзины сети (17.10.2026).
        // 1.5: панель под страницей сети, а не поверх — видно нижнее меню сайта с корзиной.
        // 1.6: корзина сети касанием «Корзины», итог с её страницы (замер Магнита 17.10.2026).
        // 1.7: ждать нужную страницу по адресу, а не по onPageStarted (замер на эмуляторе).
        // 1.8: одно касание, дальше повтор запроса сети «положить в корзину» со страницы.
        // 1.9: забор перед «Похожими», сверка артикула после касания, кнопка Дикси с ценой.
        // 1.10: кнопка в закреплённой полосе покупки, «Корзина» со значком-картинкой.
        // 1.11: повтор подменяет артикул во всех полях (goodId и offerId Магнита),
        //       «нет в наличии» в корзине сети — не «легло»; кнопку ищем ещё до трёх раз,
        //       открытую карточку не перезагружаем (замеры на эмуляторе 18.10.2026).
        // 1.12: «Корзина» со счётчиком на значке, итог перечитывается, а не открылась
        //       корзина касанием — её адрес из наряда; кнопка из плитки чужого товара не в
        //       счёт; не видно позиции в корзине сети — не «легло» (Дикси и Магнит 18.10.2026).
        // 1.12.1: «Корзина» — и пункт меню (li[role=menuitem] Магнита с доставкой); не
        //       открылась касанием — сразу адрес корзины; итог ждём дольше (до 12,5 с).
        // 1.13: сама, в фоне — пока открыта корзина, скрытое окно на сеть собирает её во
        //       всех сетях, где человек вошёл, параллельно; только если корзина поменялась
        //       и только недостающее поверх лежащего (18.10.2026).
        // 1.14: кнопка «Раздел» — карточки открытой страницы сети (адрес, название, цена)
        //       уходят на сервер и заводятся в единой базе. Это дорога каталога для
        //       Пятёрочки и Самоката, куда сервер не пробивается, а телефон видит витрину
        //       (замер 19.10.2026: 5ka.ru отдала окну 28 карточек с ценами); поиск карточки
        //       в наряде ждёт её появления до 12 с, а не читает разметку один раз.
        // 1.15: сайт занимает весь экран, как и было задумано шагом 1: убрана тёмная
        //       полоса темы платформы с названием приложения, строки состояния и
        //       навигации белые с тёмными значками, полос прокрутки не видно; в
        //       phone.css убраны пятно от касания и выделение подписей кнопок
        //       (владелец, 19.10.2026: «такое ощущение, что внутри приложения вебапп»).
        // 1.17: у openStore(code) тот же сторож моста, что у остальных методов: чужая
        //       страница внутри окна сети его не вызовет (25.10.2026).
        versionCode 21
        versionName "1.17"

        // Адрес сервера — при сборке, а не в коде: -PkorzinaServer=https://… или
        // переменная KORZINA_SERVER. Пусто — приложение скажет об этом на экране.
        def server = project.findProperty("korzinaServer") ?: System.getenv("KORZINA_SERVER") ?: ""
        buildConfigField "String", "KORZINA_SERVER", "\"${server}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Зависимостей нет нарочно: ни androidx, ни библиотек. Приложению нужен WebView
// и HTTP-клиент — оба есть в Android из коробки. Каждая лишняя зависимость —
// лишняя причина, по которой сборка не соберётся.
dependencies {
}

