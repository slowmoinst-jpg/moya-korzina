plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.moyakorzina.app'
    compileSdk 34

    defaultConfig {
        applicationId "ru.moyakorzina.app"
        // Android 7.0 не доверяет корню ISRG Root X1 (Let's Encrypt), и 1.18 по HTTPS на нём
        // не открылась бы.
        minSdk 25
        targetSdk 34
        // 1.3: приложение стало оболочкой сайта с мостом window.Korzina (шаг 1
        // единой архитектуры, 16.10.2026) — ряда кнопок сетей и нижней панели больше нет.
        // 1.4: «Собрать» — корзина в сети кнопками сайта и итог корзины сети (17.10.2026).
        // 1.5: панель под страницей сети, а не поверх — видно нижнее меню сайта с корзиной.
        // 1.6: корзина сети касанием «Корзины», итог с её страницы (замер Магнита 17.10.2026).
        // 1.7: ждать нужную страницу по адресу, а не по onPageStarted (замер на эмуляторе).
        // 1.8: одно касание, дальше повтор запроса сети «положить в корзину» со страницы.
        // 1.9: забор перед «Похожими», сверка артикула после касания, кнопка Дикси с ценой.
        // 1.10: кнопка в закреплённой полосе покупки, «Корзина» со значком-картинкой.
        // 1.11: повтор подменяет артикул во всех полях (goodId и offerId Магнита),
        //       «нет в наличии» в корзине сети — не «легло»; кнопку ищем ещё до трёх раз,
        //       открытую карточку не перезагружаем (замеры на эмуляторе 18.10.2026).
        // 1.12: «Корзина» со счётчиком на значке, итог перечитывается, а не открылась
        //       корзина касанием — её адрес из наряда; кнопка из плитки чужого товара не в
        //       счёт; не видно позиции в корзине сети — не «легло» (Дикси и Магнит 18.10.2026).
        // 1.12.1: «Корзина» — и пункт меню (li[role=menuitem] Магнита с доставкой); не
        //       открылась касанием — сразу адрес корзины; итог ждём дольше (до 12,5 с).
        // 1.13: сама, в фоне — пока открыта корзина, скрытое окно на сеть собирает её во
        //       всех сетях, где человек вошёл, параллельно; только если корзина поменялась
        //       и только недостающее поверх лежащего (18.10.2026).
        // 1.14: кнопка «Раздел» — карточки открытой страницы сети (адрес, название, цена)
        //       уходят на сервер и заводятся в единой базе. Это дорога каталога для
        //       Пятёрочки и Самоката, куда сервер не пробивается, а телефон видит витрину
        //       (замер 19.10.2026: 5ka.ru отдала окну 28 карточек с ценами); поиск карточки
        //       в наряде ждёт её появления до 12 с, а не читает разметку один раз.
        // 1.15: сайт занимает весь экран, как и было задумано шагом 1: убрана тёмная
        //       полоса темы платформы с названием приложения, строки состояния и
        //       навигации белые с тёмными значками, полос прокрутки не видно; в
        //       phone.css убраны пятно от касания и выделение подписей кнопок
        //       (владелец, 19.10.2026: «такое ощущение, что внутри приложения вебапп»).
        // 1.17: у openStore(code) тот же сторож моста, что у остальных методов: чужая
        //       страница внутри окна сети его не вызовет (25.10.2026).
        // 1.18: выбор файла на «Мои чеки» (onShowFileChooser), скачивание APK наружу
        //       (setDownloadListener), сетевой профиль без открытого трафика (26.10.2026).
        // 1.19: все сети разом, снятие уменьшенного/удалённого из корзин сетей (ledger),
        //       после «Заказать» доля в выбранных и уборка в остальных (01.11.2026).
        // 1.22: фоновая сборка выносит поиск незнакомых позиций из первого отчёта (08.11.2026).
        // 1.23: карточка Пятёрочки с переадресацией не ждёт 30 с (samePath, 08.11.2026).
        // 1.24: корзина Перекрёстка, Пятёрочки и Дикси запросами сети вместо касаний карточек (09.11.2026).
        // 1.25: Пятёрочка находит свою корзину без orderId сайта и обновляет куки защиты, темп по монотонным часам;
        //       уменьшенное снимается и при ненайденных позициях, сети с запросами кладут первыми,
        //       сеть со стеной (403) правка корзины не будит — правка во всех трёх сетях за 2,5–5 с (09.11.2026).
        // 1.28: Магнит запросами без образца, METRO запросами, in-place корзина без перезагрузки,
        //       кэш наряда 6 ч (keptPlan), неспящие окна сетей с запросами, settleLater отсекает повторные поиски (11.11.2026).
        // 1.29: Самокат запросами заново (витрина по адресу человека, копейки сети, гость — не вход, запись с версией),
        //       Пятёрочка помнит номер заказа (−1,5 с на правку), окно на robots.txt не перезагружается,
        //       за куками защиты Пятёрочки ходим только при открытом приложении (11.11.2026).
        // 1.30: итог Дикси от 1000 ₽ («1 448.71» читалось как 1 ₽), тронутая позиция перепроверяется
        //       и у слитых дублей артикула (11.11.2026).
        // 1.32: Пятёрочка после отказа узла корзин (403 её защиты) 3 минуты идёт сразу касаниями и не
        //       занимает процесс окон соседним сетям; в 1.31 метка ставилась любой сети на обрыв связи (11.11.2026).
        // 1.33: наряд, сброшенный обновлением или старше 6 ч, сеть с запросами берёт при открытии корзины, а не
        //       по первой правке (первая правка после обновления шла через сервер: Дикси 4,3–6,0 с) (12.11.2026).
        // 1.34: версия в метке User-Agent заморожена (окна сетей брали её же, и защита Пятёрочки после
        //       каждого обновления заново проверяла окно: первая правка 10 с и касаниями), настоящую
        //       версию сервер читает из куки kz_app (12.11.2026).
        // 1.35: магазин Дикси спрашиваем раз в 6 ч, а не при каждом новом окне сети: первая правка после
        //       запуска приложения шла шестью запросами, 4,4 с (12.11.2026).
        // 1.36: правка сразу уводит окно сети со страницы поиска, брошенной хвостом (раньше — через 1,1 с), а хвост
        //       не начинается, пока экрана касались меньше 10 с назад: правка при идущем хвосте шла 4,6–5,6 с
        //       во всех сетях против 1,2–2,0 с без него (12.11.2026).
        // 1.37: правка товара, которого сеть не знает, больше не ждёт сервера: «−» у товара из поиска (страница
        //       говорит, остался ли он) и любая правка товара из rest наряда (сеть его не получит) наряд не меняют;
        //       раньше такая правка шла 5,6–6,2 с во всех сетях. Время правки в отчёте сети считается от касания
        //       экрана, а не от обработчика страницы (при занятом потоке окон отчёт занижал его на 1,1 с), и его
        //       получает и новый товар: он идёт через сервер, и журнал таких правок не видел (12.11.2026).
        // 1.38: в режиме входа сайт сети не уводит окно «назад» на наш экран из своего скрипта: Самокат после
        //       отправки номера зовёт router.back(), и поле кода из СМС пропадало через 2 с (12.11.2026).
        // 1.39: сеть собирает корзину по адресу человека из настроек приложения (place наряда). Самокат: из
        //       адресов профиля выбирается ближайший к нему — сайт сам брал последний добавленный, у владельца
        //       это был адрес в другом городе; вход узнаётся по типу пользователя в токене (вошедшего через
        //       Сбер ID адаптер считал гостем и корзину не собирал). Магнит: магазин расчёта и доставка, если
        //       магазин сайта не у адреса человека или выбран самовывоз (12.11.2026).
        // 1.40: Самокат. Больше остатка витрины сеть не кладёт и молчит — причина теперь «у сети осталось N»,
        //       а не «сеть не положила». Доплата до минимального заказа в «доставку» не идёт: в итог сети
        //       она не входит, пока человек её не включил (было: товары 399 + «доставка» 220 при итоге 438).
        //       Адрес из профиля выбирается в сети после того, как она подтвердила, что по нему доставляет
        //       (12.11.2026).
        // 1.41: Пятёрочка. Правка по касанию не перечитывает корзину, которую приложение видело меньше минуты
        //       назад: одна запись вместо чтения и записи, сверка — по ответу сети (чтение — 0,85 с из 1,5 с
        //       правки, после простоя до 3 с). Пока человек на экране корзины, приложение само читает корзину
        //       Пятёрочки раз в 40 с. Памяти нет веры после возвращения в приложение и из окна сети: там
        //       корзину могли оформить в заказ. Дикси: та же память, корзину читаем один раз вместо двух
        //       (чтение со скидками у сети — от 0,3 до 1,4 с), заранее — только по касанию (13.11.2026).
        // 1.42: Магнит. «Легло» сверяется с корзиной сети после расчёта оформления: позицию, которой в магазине
        //       нет, сеть оставляет строкой с количеством 0, ограниченную урезает до остатка, а ответ на запись
        //       показывал записанное (было «легло 11 из 11» при четырёх нулях в корзине сети). Лишнее чтение
        //       корзины — одно и только когда приложение что-то прибавляло (13.11.2026).
        // 1.43: товар, найденный поиском самой сети, приложение числит своим: артикул берёт из адреса карточки
        //       тем же правилом, что сервер (rules.sku_url). Память телефона такую позицию не знала, и после
        //       удаления из корзины товар оставался в корзине сети (Магнит, 13.11.2026). Пока товар в корзине,
        //       найденное для него не снимается и без строки поиска в наряде (plan.pids), а отчёт не зовёт его
        //       «лишним» (13.11.2026).
        // 1.44: наряд фоновой сборки, не пришедший за 1,8 с, спрашивается второй раз, берётся первый ответ.
        //       Наряды шести сетей уходят разом, часть — по новым соединениям, и одно из них изредка
        //       открывается 3–17 с (VPN, потерянный пакет): Самокат ждал наряд 16,9 с при 0,7–1,1 с у
        //       остальных. Отчёт несёт, сколько сборка ждала наряд (plan_ms): в журнале правок видно,
        //       сервер это или дорога к нему. Оба запроса несут один номер вопроса (ask): медлит сервер —
        //       повтор ждёт ответ первого, наряд не считается дважды (13.11.2026).
        // 1.45: сборка с пустым нарядом (класть нечего, только снять своё) запоминается, как любая другая:
        //       на телефоне владельца её заново запускала каждая страница — Лента 7 раз и Пятёрочка 4 раза
        //       за минуту. Ранний отчёт несёт пометкой, почему запросами сети не вышло. «Собрано» про
        //       другую корзину снимается с началом новой сборки (13.11.2026).
        // 1.46: Дикси при серии правок. Сборка, которую догнала следующая правка, не читает итог своей
        //       корзины: запрос за ним занимал место в темпе (один запрос в секунду) у записи следующей,
        //       и очередь росла — с телефона владельца 11 удалений подряд дали отчёт через 6,2 с после
        //       последнего касания. Корзина остаётся расчётом, следующая сборка пишет по ней и сверяется
        //       чтением; «своё» по расчёту приложение не убавляет, а сборка по расчёту, оборвавшаяся в первые
        //       10 с, идёт заново, с чтением (13.11.2026).
        // 1.47: Дикси. Повтор сборки по расчёту получает и запрос, зависший до таймаута (15 с): порог возраста
        //       сборки для повтора — 20 с вместо 10, возраст считается по модулю (13.11.2026).
        // 1.48: товар, найденный поиском сети. Строка поиска несёт фасовку из наряда, и карточка другого
        //       веса не кладётся: у Пятёрочки «хлопья №3 350 г» легли карточкой «…№2 500 г». Сервер
        //       связывает найденную и положенную карточку с товаром и говорит об этом в ответе на отчёт
        //       (bound) — наряд в памяти телефона считается старым, новый несёт артикул, и следующая
        //       правка идёт запросом сети, а не поиском заново: корзина из чека собиралась 96–135 с.
        //       Сеть, которая не знает ни одного товара корзины, отчитывается сразу, а ищет после отчёта
        //       и в тишине, как сети со знакомыми товарами: раньше поиск начинался под палец и держал
        //       отчёт до своего конца. Карточка другой фасовки, уже лежащая в корзине сети, «лежит» не
        //       получает, а лежащая своя уходит в отчёт с адресом карточки: по нему сервер даёт товару
        //       артикул и для того, что положено до 1.48 (13.11.2026).
        // 1.49: товар, который приложение уже нашло поиском сети и положило, в следующих сборках идёт
        //       как знакомый: артикул и адрес карточки берутся из памяти телефона (ownFound). Раньше
        //       хвост после каждой правки заново открывал поиск и карточку каждой лежащей позиции —
        //       десятки секунд касаний, после которых сеть закрывает запросы. Лишнее у такой позиции не
        //       снимается: количество в сети человек мог поправить сам. Положенное до 1.49 (отметки о
        //       сверке фасовки у него ещё нет) один раз ищется, как раньше (13.11.2026).
        // 1.50: Пятёрочка. «Обрыв сети» узла корзин — мгновенный отказ её защиты: куку spsc, протухшую, но не
        //       пропавшую, он не принимает, а главная страница её не заменяет. Сеть уходила на три минуты в
        //       касания (телефон владельца, 13.11.2026: правки «0 из 7» за 0,3 с, потом хвост 90 с). Теперь кука
        //       стирается в хранилище WebView, открывается главная, ждём новую куку И догрузившуюся страницу
        //       (стенд: 10–12 с) и запрос повторяется — но не раньше 65 с после отказа: узел отказывает и
        //       настоящей, и новой куке около минуты после первого отказа. Лечится только быстрый отказ первого
        //       запроса сборки при живой связи (fast в cartapi.js): таймаут, обрыв посреди записи (принятый запрос
        //       значит, что кука жива) и телефон без сети куку не трогают, их ведёт прежний вход (главная, 4 с,
        //       повтор). Для надёжного navigator.onLine добавлено разрешение ACCESS_NETWORK_STATE (обычное).
        //       Чтение заранее, не вышедшее таким отказом, лечит куку само, до первой правки (смотрит до 4,5 с),
        //       и до конца паузы к узлу не ходят ни другие сборки (стена), ни чтение заранее, ни хвост поиска
        //       (окно держит healing); правка, пришедшая за это время, ждёт паузу, а не идёт касаниями. Быстрый —
        //       меньше 8 с (таймаут запроса 15 с). Страница «Проблемы со связью» (защита закрыла адрес) — к узлу
        //       корзин не ходим 30 мин (метка в часах телефона): ни лечения, ни запросов, ни подогрева. Что вышло с кукой и
        //       почему её не лечили, дописывается к причине отказа (13.11.2026).
        // 1.51: куку лечат не чаще раза в 15 мин (было 5): на стенде шесть лечений за час кончились закрытым
        //       защитой адресом (14.11.2026). Протухшая кука лечится с первого раза; частые повторы нужны только
        //       там, где причина не в куке, а их защита считает ботом. Версия отличает настоящую сборку в
        //       журнале правок от пробных 1.50 на эмуляторе.
        // 1.52: куку защиты Пятёрочки стирают и на родительском домене (.5ka.ru): настоящая spsc живёт там, а не на
        //       узле 5d.5ka.ru, и прежнее стирание её не брало бы. Чем кончилось лечение при чтении заранее,
        //       дописывается к причине отказа сборки (журнал отказов на сервере; на телефоне это видно только в logcat).
        // 1.53: обновление стирает стену apiwall.* прежней версии: первые минуты 1.51 на телефоне прошли за стеной
        //       отказа 1.49 (метка переживает обновление), и новая версия узел не проверяла (14.11.2026).
        // 1.59: сеть без запросов (Впрок, Лента, ВкусВилл, Fix Price, Монетка) спрашивает наряд сразу и ждёт сети с
        //       запросами уже с нарядом (heldForApi): сборка, которой класть и снимать нечего, отчитывается сразу
        //       (Впрок на эмуляторе 15.11.2026 ждал 5,45 с ради «не пошла»).
        // 1.60: правка Пятёрочки, в которой одни давние отказы (тронутый товар, которого сеть не берёт), пишет по
        //       памяти корзины без чтения перед записью, и память остаётся следующей правке (эмулятор 15.11.2026:
        //       батон — 6,3 и 7,2 с при двух запросах).
        // 1.61: страница проверки Пятёрочки /xpvnsulc/, не отпустившая до конца лечения, — блок (эмулятор 15.11.2026:
        //       лечение ждало её текста до конца, не поставило блок и пустило сеть касаниями — три минуты карточек
        //       по закрытому адресу). При блоке фоновая сборка кончается отказом без касаний и поиска (endBlocked:
        //       в начале сборки и при отказе запросов; хвост после отчёта просто не идёт); хроника уходит на сервер.
        // 1.62: Впрок кладётся запросами сети (cartapi.js, runVprok: чтение dropDownV2 и одна запись positionV2 на
        //       все позиции; правка по касанию без чтения, если корзину видели меньше минуты назад). Запись с неизвестным
        //       сайту артикулом он отвечает 429 и не пишет ничего: такую пачку адаптер пишет по одной позиции. 429 на
        //       чтении — стена на ASK_WAIT_MS: ни запросов, ни касаний (apiblock). Выключатель: API_SINCE у vprok.
        // 1.63: Пятёрочка сверяет адрес своей корзины с адресом из приложения (rules.place, координаты, как у Самоката).
        //       Корзина дальше 5 км (сайт сам ставит «Тверская улица, 1», когда адрес в окне не выбран) — отказ «address»
        //       с расстоянием и просьбой выбрать свой адрес в окне Пятёрочки; в такую корзину не пишем (16.11.2026).
        // 1.65: ожидание обновления входа укладывается в срок фоновой сборки.
        // 1.66: обновление загружается прямо в системный установщик Android.
        versionCode 83
        versionName "1.79"
        if (project.hasProperty("releaseVersionCode")) {
            versionCode project.property("releaseVersionCode").toInteger()
            versionName project.property("releaseVersionName")
        }

        // Адрес сервера — при сборке, а не в коде: -PkorzinaServer=https://… или
        // переменная KORZINA_SERVER. Пусто — приложение скажет об этом на экране.
        def server = project.findProperty("korzinaServer") ?: System.getenv("KORZINA_SERVER") ?: ""
        buildConfigField "String", "KORZINA_SERVER", "\"${server}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

