# Конфигурация оптимизатора продуктовой корзины
db_path: data/basket.db
baseline_store: pyaterochka          # магазин, относительно которого считается экономия
extra_order_penalty_rub: 150.0       # штраф за каждый дополнительный заказ (раздел 6)
weight_tolerance_pct: 20             # допуск по граммовке для штучных товаров
connectors:
  rate_limit_rps: 1.0                # не чаще 1 запроса в секунду на магазин
  cache_ttl_hours: 6
  timeout_sec: 10
  failure_threshold: 3                # после стольких неудач подряд магазин до конца сеанса идёт из fallback
  magnit_shop_code:                   # код конкретного магазина Магнита: от него зависят и цены,
                                      # и сам ассортимент. Подсмотреть в адресе magnit.ru после
                                      # выбора магазина (параметр shopCode). Пусто — магазин сайта
                                      # по умолчанию, сейчас Краснодар.
  magnit_shop_type: ME                # формат точки из того же адреса (ME, MM, DG, GM, MC…)
  magnit_delivery: true               # true — цены доставки, false — цены самовывоза. Они разные.
  lenta_address: Москва, Ходынский бульвар 4   # Лента отвечает ценами только по адресу или коду точки:
  smart_extract:                      # запасной разбор страницы языковой моделью:
    enabled: false                    # включается, только если вёрстка магазина сменилась
    model: openai/gpt-4o-mini         # ollama/llama3.1 — локально и без ключа
    base_url:                         # для ollama: http://localhost:11434
    max_chars: 20000                  # сколько разметки отдаём модели
                                      # ставится отдельно: pip install scrapegraphai
                                      # ключ — в переменной окружения, не здесь
  lenta_store_id:                     # НЕ ЗАПОЛНЯТЬ без крайней нужды. Проверено 15.09.2026:
                                      # коды из nearest_stores витрина доставки не принимает —
                                      # по ним поиск даёт ноль позиций, а карточка цену 0 и
                                      # остаток 0, то есть магазин выглядит пустым, а не сломанным.
                                      # nearest_stores перечисляет физические магазины сети, и это
                                      # не те точки, по которым считается доставка. Спрашивайте адресом.
optimizer:
  max_stores: 5                      # перебор разбиений на 1..5 магазинов —
                                     # столько же, сколько магазинов в справочнике
  top_n: 3
