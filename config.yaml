# Конфигурация оптимизатора продуктовой корзины
db_path: data/basket.db
baseline_store: pyaterochka          # магазин, относительно которого считается экономия
extra_order_penalty_rub: 150.0       # штраф за каждый дополнительный заказ (раздел 6)
weight_tolerance_pct: 20             # допуск по граммовке для штучных товаров
connectors:
  rate_limit_rps: 1.0                # не чаще 1 запроса в секунду на магазин
  cache_ttl_hours: 6
  timeout_sec: 10
  failure_threshold: 3                # после стольких неудач подряд магазин до конца сеанса идёт из fallback
  magnit_shop_code:                   # ЗАПАСНОЙ код магазина Магнита, нужен только когда адреса
                                      # нет: при заданном адресе магазин подбирается сам —
                                      # адрес переводится в точку (app/geo.py) и по точке
                                      # спрашивается справочник магазинов Магнита
                                      # (app/connectors/magnit.py, nearest_store). От магазина
                                      # зависят и цены, и ассортимент, поэтому одна настройка на
                                      # всех врала бы каждому, кто живёт не там. Свой код можно
                                      # подсмотреть в адресе magnit.ru после выбора магазина
                                      # (параметр shopCode). Пусто и без адреса — краснодарский
                                      # магазин 992301, тот же, на котором стоит общий каталог.
  home_exit:                          # выход через домашний интернет владельца (app/homeexit.py):
    proxy: socks5://172.17.0.1:1080   # туннель с его ноутбука (tools/tunnel) через мост
    chains: [dixy, pyaterochka, samokat, magnit] # из дома отдаёт витрину с ценами (замер 25.09.2026).
                                          # Магнит блокирует серверный IP (timeout) — ходит через дом.
                                      # Туннеля нет — сеть идёт как раньше, без цен с витрины.
  magnit_shop_type: ME                # формат точки: MM, ME, GM, MK, MM_MINI. При подобранном
                                      # по адресу магазине приходит от самого Магнита.
  magnit_delivery: true               # true — цены доставки, false — цены самовывоза. Они разные.
  lenta_address: Москва, Ходынский бульвар 4   # запасной адрес для установки «для себя»: адрес с экрана
                                      # его перебивает. Лента считает цены только по адресу или коду хаба.
  smart_extract:                      # разбор страницы языковой моделью там, где
    enabled: true                     # вёрстку не понял разбор коннектора
    model: openrouter/deepseek/deepseek-v4-flash   # ollama/llama3.1 — локально и без ключа
    base_url:                         # пусто = openrouter.ai; для ollama http://localhost:11434
    max_chars: 20000                  # сколько разметки отдаём модели
                                      # ключ — в OPENROUTER_API_KEY, в конфиге ему не место
  lenta_store_id:                     # запасной КОД ХАБА ДОСТАВКИ, нужен только когда адреса нет: при
                                      # заданном адресе не используется — адрес сам разрешается в хаб
                                      # и кэшируется. Код — suggested.delivery.aliasId из
                                      # storefront_resolve_store (номер ТК), проверено 16.09.2026:
                                      # 291 — Москва, Ходынский бульвар 4; 302 — Москва, Ленинский
                                      # проспект 45; 10 — Санкт-Петербург, Невский проспект 28;
                                      # 203 — Екатеринбург, улица Щербакова 4. Чужой код не падает:
                                      # aliasId другого магазина отвечает ЕГО ценами, внутренний id
                                      # магазина — пустотой или чужим магазином, код магазина без
                                      # доставки — пустым поиском. Подробности: app/connectors/lenta.py.
  metro_api_token:                    # ИМЕННОЙ токен METRO. Спецификация сети требует его в адресе
                                      # (/api/v1/{api_token}/{store_id}/…), и это ПРАВИЛЬНАЯ дорога:
                                      # получить его можно через форму METRO для бизнеса, тема
                                      # «Запросы на сотрудничество». Пока пусто — адрес собирается
                                      # без токена; так сеть тоже отвечает, но это не описано в её
                                      # спецификации, поэтому запасной путь, а не основной. Разбор
                                      # и оговорки — в шапке app/connectors/metro.py.
  metro_store_id:                     # ЗАПАСНОЙ код торгового центра, нужен только когда адреса нет.
                                      # При заданном адресе центр подбирается сам, по расстоянию.
                                      # Проверено 19.09.2026: 15 — Петербург, Комендантский пр-т 3;
                                      # 16 — Петербург, пр-т Косыгина 4; 20 — Петербург, Пулковское
                                      # шоссе 23. Цена внутри города одна на все центры, остаток свой.
  metro_max_km: 60                    # дальше этого ближайший центр METRO уже не «ваш»: без потолка
                                      # человек из города без METRO видел цены центра за сотни км
# Адрес поиска по названию — последняя ступень передачи корзины и самая устойчивая:
# не зависит ни от идентификаторов товаров, ни от вёрстки, ни от нашего доступа к
# каталогу. Ссылку открывает телефон человека, где он обычный покупатель, поэтому
# защита от автоматического доступа ей не мешает.
#   {q} — название товара, подставляется закодированным.
# ПРОВЕРЕНО живыми запросами 15.09.2026: magnit, vkusvill, lenta.
# НЕ ПРОВЕРЕНО отсюда: 5ka и samokat блокируют по географии («Проверьте настройки
#   интернета и VPN»), dixy отвечает капчей. Адреса записаны по общему виду их сайтов.
#   Если какой-то окажется неверным — это одна строка здесь, а не правка кода;
#   и человек не застрянет: кнопка кладёт название в буфер обмена вместе с переходом.
search_url:
  magnit: https://magnit.ru/search/?term={q}
  vkusvill: https://vkusvill.ru/search/?q={q}
  lenta: https://lenta.com/search/?q={q}
  dixy: https://dixy.ru/search/?q={q}
  pyaterochka: https://5ka.ru/search/?text={q}
  samokat: https://samokat.ru/search?query={q}

optimizer:
  # Во что обходится ЗАВЕСТИ корзину в магазин руками. Не деньги: человек их никому
  # не платит, и в итог к оплате они не входят. Но без них расчёт охотно отправляет
  # в третий магазин ради сорока рублей, где на перебивание уйдёт четверть часа.
  # Ступени — из app/handover.py: link — корзина уезжает одной ссылкой, items —
  # нажать по карточке на каждую позицию, list — перебить список руками.
  handover_penalty_rub:
    link: 0        # корзина уезжает одной ссылкой — руками делать нечего
    items: 90      # нажать по карточке на каждую позицию, товар открывается сразу
    search: 160    # нажать, посмотреть выдачу поиска, выбрать нужное — лишний шаг на позицию
    list: 220      # перебить список руками
  max_stores: 5                      # перебор разбиений на 1..5 магазинов —
                                     # столько же, сколько магазинов в справочнике
  top_n: 3
  store_extra_rub: {}                # своя цена времени на сеть сверх передачи корзины:
                                     # дальний самовывоз, неудобное окно доставки.
                                     # Пример: {metro: 300}. Как и передача, в итог к
                                     # оплате не входит, только в выбор варианта.

# Свежесть цен в расчёте корзины (app/service.py, line_price). Цена старше срока
# не выбрасывается — у Пятёрочки и Самоката других нет, это цены по чекам, — а
# помечается на «Результате»: акция могла кончиться, цена — вырасти.
prices:
  stale_after_days: 7

# Кабинет ФНС «Мои чеки онлайн» со стороны сервера (app/fns). Адреса взяты из кода
# самого кабинета 16.09.2026; живой вход отсюда не проверялся, поэтому запись номера
# настраивается: digits — 79991234567, plus — +79991234567, masked — +7 (999) 123-45-67.
fns:
  base_url: https://lkdr.nalog.ru
  phone_style: digits
  timeout_sec: 20
  # Сколько чеков спрашиваем у кабинета одновременно. Позиции он отдаёт только по
  # одному ключу за запрос (bulk у него нет), поэтому на полутора тысячах чеков
  # последовательный обход — это минут десять, а впятером — около трёх. Пауза между
  # запросами остаётся своя у каждого потока, так что нагрузка растёт ровно во столько
  # раз, сколько здесь стоит. Ставить много незачем: упрёмся в ФНС, а не в себя.
  workers: 5

# Приёмная дверь (app/api.py): POST /api/prices, POST /api/cartplan,
# GET /api/health. Живёт внутри службы korzina-jobs — это единственный процесс
# приложения, который работает постоянно. Замок — секрет рабочего места; без
# верного секрета дверь не делает ни одной записи.
#
# СВОЕГО КЛИЕНТА У ЭТОЙ ДВЕРИ БОЛЬШЕ НЕТ. Она писалась для расширения-сборщика,
# которое владелец снял 17.09.2026 («только работа в нашем приложении»): вход в
# сети и наполнение корзины переехали в app/shopbrowser, браузер на самом сервере.
# Дверь оставлена — под замком, с тестами и никому не мешает, — но живой дорогой
# её считать нельзя. Разбор решения — docs/design/extension.md.
api:
  enabled: true
  port: 8765                         # свой порт, а не 8501: на 8501 отвечает экран
                                     # приложения. С 17.09.2026 те же маршруты /api/…
                                     # отвечают и на порту экрана — этот остался для
                                     # случая, когда экрана нет вовсе.
  host: 0.0.0.0                      # в контейнере иначе не достучаться снаружи;
                                     # для запуска «для себя» можно поставить 127.0.0.1,
                                     # и тогда дверь не видна из локальной сети

# Единый каталог (app/catalog): общая база на сервере, обход сетей раз в сутки,
# сопоставление товаров между сетями. Подробности — docs/design/catalog-2026-09-16.md.
catalog:
  db_path: data/catalog.db
  refresh_at: "03:30"                # время суток по часам сервера
  chains: [magnit, metro, fixprice, vkusvill, lenta, dixy, perekrestok, vprok, monetka, pyaterochka, samokat]
                                     # ПОРЯДОК ЗДЕСЬ ЗНАЧИМ: обход идёт по очереди и его
                                     # обрывает любая выкладка, поэтому сети С ЦЕНАМИ стоят
                                     # первыми. Проверено на vprok и monetka: они стояли в
                                     # хвосте и за сутки не собрались НИ РАЗУ (20.09.2026).
                                     # METRO даёт цену по точке, остаток числом и штрихкоды
                                     # одним ответом — самый полный источник из всех.
                                     # Fix Price берётся только браузером: простому запросу
                                     # он отдаёт заглушку в 1,8 КБ, окну — витрину с ценами.
                                     # Перекрёсток и Впрок — каталоги БЕЗ ЦЕН: у них открыта
                                     # карта сайта и закрыта карточка; нужны, чтобы опознавать
                                     # строки их чеков. У Пятёрочки и Самоката нет и этого.
  rate_limit_rps: 1.0
  fresh_hours: 12                    # плановый обход пропускает сеть, обойденную без ошибок
                                     # за столько часов: так внеочередной вечерний обход не
                                     # удваивается ночным. Обходы разных процессов к тому же
                                     # не идут разом — ждут друг друга (worker.one_crawler).
  fixprice:
    max_sections: 40                 # разделов с витрины за обход
    max_pages: 60                    # страниц на раздел, по 24 товара
    settle_ms: 2500                  # сколько ждать состояние Nuxt после разметки
  # Обход идёт ПО ТОЧКАМ ЛЮДЕЙ: магазины подбираются к адресам рабочих мест
  # (app/places.py), а не перечисляются здесь. Потолок держит объём работы в узде:
  # число точек растёт с числом людей, а обход одного магазина Магнита — это
  # десять минут. Сверх потолка точки в обход не идут, но записываются в журнал.
  max_points_per_chain: 3
  magnit:
    store_code: "992301"             # ЗАПАСНОЙ магазин: берётся, только когда ни одного
                                     # адреса не указано (свежий сервер, установка «для
                                     # себя»). Краснодар, 22,5 тыс. позиций — самая
                                     # широкая полка из виденных.
    store_type: dostavka
    catalog_type: "3"
  lenta:
    store_id: 291                    # ЗАПАСНОЙ хаб доставки (suggested.delivery.aliasId из
                                     # resolve_store), 291 — Москва. При указанном адресе
                                     # хаб подбирается к нему.
    details_per_run: 2000            # карточек за обход: 80 тыс. позиций набираются за несколько недель
  vkusvill:
    details_per_run: 2000
  dixy:
    max_brand_queries: 400
    max_shelf_pages: 80              # страниц на раздел витрины (по 30 товаров) через домашний выход
    shelf_skip: [skidki-po-karte, vygodno-dlya-lyudey, novinki, vitaminiziruysya, olife,
                 igray-i-vyigryvay, zakazyvay-onlayn, posuda-za-nakleyki, davay-soberis,
                 vyigryvay-kurs, uchastvuy-v-rozygryshe]
                                     # подборки, а не разделы: их товары лежат и в обычных
                                     # разделах, а обход подборок только удвоил бы запросы через дом
  pyaterochka:
    max_pages: 30
  samokat:
    max_pages: 30

